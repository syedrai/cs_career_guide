    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        .slide-in {
            animation: slideIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .option-card {
            transition: all 0.3s ease;
        }
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .progress-bar {
            transition: width 0.5s ease-in-out;
        }
        .role-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>

        // Initialize the quiz
        function initQuiz() {
            userName = nameInput.value.trim();
            if (!userName) {
                alert('Please enter your name to continue.');
                return;
            }
            
            // Hide name section, show quiz section
            nameSection.classList.add('hidden');
            quizSection.classList.remove('hidden');
            
            // Initialize answers array
            userAnswers = new Array(quizData.length).fill(null);
            
            // Start timer
            startTime = new Date();
            timerInterval = setInterval(updateTimer, 1000);
            
            // Load first question
            loadQuestion(currentQuestion);
        }

        // Update timer display
        function updateTimer() {
            const now = new Date();
            const diff = Math.floor((now - startTime) / 1000);
            const minutes = Math.floor(diff / 60);
            const seconds = diff % 60;
            timerElement.textContent = `Time: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        // Load a question
        function loadQuestion(index) {
            // Update question counter and progress bar
            questionCounter.textContent = `Question ${index + 1} of ${quizData.length}`;
            progressBar.style.width = `${((index + 1) / quizData.length) * 100}%`;
            
            // Update navigation buttons
            prevBtn.classList.toggle('hidden', index === 0);
            nextBtn.textContent = index === quizData.length - 1 ? 'See Results' : 'Next';
            
            // Set question text
            questionText.textContent = quizData[index].q;
            
            // Clear options container
            optionsContainer.innerHTML = '';
            
            // Create option buttons
            const options = quizData[index].a;
            Object.keys(options).forEach(role => {
                const optionData = options[role];
                const optionDiv = document.createElement('div');
                optionDiv.className = `option-card bg-slate-700 p-4 rounded-xl cursor-pointer transition-all duration-300 hover:bg-slate-600 ${userAnswers[index] === role ? 'glow' : ''}`;

                    <div class="flex items-center">
                        <div class="w-8 h-8 rounded-full border-2 ${userAnswers[index] === role ? 'border-cyan-400' : 'border-slate-400'} flex items-center justify-center mr-3">
                            ${userAnswers[index] === role ? '<i class="fas fa-check text-cyan-400"></i>' : ''}
                        </div>
                        <span>${optionData.text}</span>
                    </div>
                `;
                
                optionDiv.addEventListener('click', () => {
                    userAnswers[index] = role;
                    loadQuestion(currentQuestion); // Reload to update selection
                });
                
                optionsContainer.appendChild(optionDiv);
            });
            
            // Add animation
            questionText.classList.remove('slide-in');
            void questionText.offsetWidth; // Trigger reflow
            questionText.classList.add('slide-in');
        }

        // Navigate to previous question
        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion(currentQuestion);
            }
        }

        // Navigate to next question or show results
        function nextQuestion() {
            if (userAnswers[currentQuestion] === null) {
                alert('Please select an answer before continuing.');
                return;
            }
            
            if (currentQuestion < quizData.length - 1) {
                currentQuestion++;
                loadQuestion(currentQuestion);
            } else {
                showResults();
            }
        }

        // Calculate and display results
        function showResults() {
            // Stop timer
            clearInterval(timerInterval);
            
            // Calculate scores with weights
            const scores = {};
            Object.keys(roles).forEach(role => {
                scores[role] = 0;
            });
            
            userAnswers.forEach((answer, index) => {
                if (answer) {
                    const weight = quizData[index].a[answer].weight;
                    scores[answer] += weight;
                }
            });
            
            // Find highest scoring role(s)
            let maxScore = 0;
            let topRoles = [];
            
            Object.keys(scores).forEach(role => {
                if (scores[role] > maxScore) {
                    maxScore = scores[role];
                    topRoles = [role];
                } else if (scores[role] === maxScore) {
                    topRoles.push(role);
                }
            });
            
            // Hide quiz section, show results section
            quizSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
            
            // Display results
            if (topRoles.length === 1) {
                // Single top role
                const role = topRoles[0];
                displayRoleResult(role, scores);
            } else {
                // Tie - let user choose
                displayTieResults(topRoles, scores);
            }
        }

        // Display result for a single role
        function displayRoleResult(roleKey, scores) {
            const role = roles[roleKey];
            const score = scores[roleKey];
            const maxPossible = 60; // Maximum possible score
            
            resultsContent.innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-8 mb-8">
                    <div class="text-center mb-6">
                        <i class="${role.icon} role-icon ${role.color} pulse"></i>
                        <h2 class="text-3xl font-bold mb-2">Congratulations, ${userName}!</h2>
                        <p class="text-slate-300 text-lg">Your cybersecurity career match is:</p>
                    </div>
                    <div class="text-center mb-6">
                        <h3 class="text-2xl font-semibold ${role.color} mb-4">${role.name}</h3>
                        <div class="inline-block bg-slate-700 px-4 py-2 rounded-full mb-4">
                            <span class="text-cyan-400 font-semibold">Match Score: ${score}/${maxPossible}</span>
                        </div>
                        <p class="text-slate-300 max-w-2xl mx-auto mb-6">${role.description}</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
                        <div class="bg-slate-700 p-4 rounded-lg">
                            <h4 class="font-semibold text-cyan-400 mb-2">Key Skills</h4>
                            <ul class="text-sm text-slate-300">
                                ${role.skills.map(skill => `<li class="mb-1"><i class="fas fa-check text-green-400 mr-2"></i>${skill}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="bg-slate-700 p-4 rounded-lg">
                            <h4 class="font-semibold text-cyan-400 mb-2">Personality Fit</h4>
                            <p class="text-sm text-slate-300">${role.personality}</p>
                        </div>
                    </div>
                </div>
                <button id="show-roadmap" class="px-6 py-3 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-700 hover:to-blue-700 rounded-lg transition duration-300 transform hover:scale-105">
                    <i class="fas fa-map mr-2"></i>View Your Personalized 30-Day Roadmap
                </button>
            `;
            
            document.getElementById('show-roadmap').addEventListener('click', () => {
                displayRoadmap(roleKey);
            });
        }

        // Display tie results and let user choose
        function displayTieResults(roleKeys, scores) {
            resultsContent.innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-8 mb-8">
                    <div class="text-center mb-6">
                        <i class="fas fa-trophy text-3xl text-yellow-400 mb-4 pulse"></i>
                        <h2 class="text-3xl font-bold mb-2">Close Call, ${userName}!</h2>
                        <p class="text-slate-300 text-lg">You're equally suited for multiple roles. Choose your path:</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
                        ${roleKeys.map(roleKey => {
                            const role = roles[roleKey];
                            const score = scores[roleKey];
                            return `
                                <div class="option-card bg-slate-700 p-4 rounded-xl cursor-pointer transition-all duration-300 hover:bg-slate-600" data-role="${roleKey}">
                                    <div class="text-center mb-3">
                                        <i class="${role.icon} text-2xl ${role.color} mb-2"></i>
                                        <h3 class="font-semibold">${role.name}</h3>
                                        <div class="text-xs bg-slate-600 inline-block px-2 py-1 rounded-full mt-1">
                                            Score: ${score}/60
                                        </div>
                                    </div>
                                    <p class="text-sm text-slate-400">${role.description.substring(0, 120)}...</p>
                                    <div class="mt-3">
                                        <span class="text-xs text-cyan-400">Key skills: ${role.skills.slice(0, 2).join(', ')}</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
            
            // Add event listeners to role options
            document.querySelectorAll('.option-card[data-role]').forEach(card => {
                card.addEventListener('click', () => {
                    const roleKey = card.getAttribute('data-role');
                    displayRoleResult(roleKey, scores);
                });
            });
        }

        // Display roadmap for a role
        function displayRoadmap(roleKey) {
            roadmapContainer.classList.remove('hidden');
            roadmapContent.innerHTML = `
                <div class="mb-6 text-center">
                    <h3 class="text-xl font-semibold ${roles[roleKey].color}">${roles[roleKey].name} Roadmap</h3>
                    <p class="text-slate-400">Follow this 30-day plan to build foundational skills</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    ${roadmaps[roleKey].map((day, index) => `
                        <div class="bg-slate-700 p-4 rounded-lg option-card">
                            <div class="font-semibold text-cyan-400 mb-1">${day.split(':')[0]}</div>
                            <div class="text-slate-300">${day.split(':').slice(1).join(':')}</div>
                        </div>
                    `).join('')}
                </div>
                <div class="mt-6 text-center">
                    <p class="text-slate-400 text-sm">Continue learning with hands-on practice and real-world projects after completing this roadmap.</p>
                </div>
            `;
            
            // Scroll to roadmap
            roadmapContainer.scrollIntoView({ behavior: 'smooth' });
        }

        // Restart the quiz
        function restartQuiz() {
            currentQuestion = 0;
            userAnswers = [];
            userName = '';
            
            // Hide results section, show name section
            resultsSection.classList.add('hidden');
            roadmapContainer.classList.add('hidden');
            nameSection.classList.remove('hidden');
            
            // Reset name input
            nameInput.value = '';
        }

        // Event Listeners
        startBtn.addEventListener('click', initQuiz);
        prevBtn.addEventListener('click', prevQuestion);
        nextBtn.addEventListener('click', nextQuestion);
        restartBtn.addEventListener('click', restartQuiz);

        // Allow Enter key to start quiz
        nameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                initQuiz();
            }
        });
    </script>
</body>
</html>
